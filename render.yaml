services:
  - type: web
    name: haraka-backend
    env: node
    region: oregon
    # Must be a paid plan: free instances sleep after 15 min idle and the first
    # customer request then waits ~30-60s for a cold start.
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 🚀 PERFORMANCE: Increase Node.js memory limit for Render starter plan (512MB RAM)
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      # Secrets: set the values in the Render dashboard (sync: false = not stored in this file)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_ENABLED
        value: true
      - key: PAWAPAY_API_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      # Business configuration
      - key: FOOD_SERVICE_FEE
        value: 300
      - key: PARCEL_SERVICE_FEE
        value: 100
      - key: DB_SYNCHRONIZE
        value: true
